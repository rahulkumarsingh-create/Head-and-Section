<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">NOVA</div>

        <div class="nav-links">
            <a href="#">About us</a>
            <a href="#">Services</a>
            <a href="#">Selected work</a>
            <a href="#">Reviews</a>
        </div>

        <div class="nav-right">
            <span>PL / EN</span>
            <button>Start a project</button>
        </div>

    </nav>

    <section class="hero">

        <div class="hero-left">

            <p class="category">
                STRATEGY / DESIGN / TECHNOLOGY
            </p>

            <h1>
                New possibilities for
                <span>ambitious brands</span>
            </h1>

            <p class="description">
                We create modern websites that strengthen your image,
                attract clients and turn your business goals into real growth.
            </p>

            <div class="buttons">
                <button class="primary-btn">Start a project</button>
                <button class="secondary-btn">Meet the team</button>
            </div>

        </div>

        <div class="hero-right">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=900&q=80" alt="Person working">
            </div>
        </div>

    </section>

    <div class="trusted">
        <span>Trusted by</span>
        <strong>MODO</strong>
        <strong>LUMI</strong>
        <strong>KOVO</strong>
        <strong>NOMA</strong>
        <strong>ASPEKT</strong>
    </div>

</body>
</html>
